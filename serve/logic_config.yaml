# ═══════════════════════════════════════════════════════════════════════════
#  Resident LLM line-up for your grading slot  (EXACT 2026)
# ═══════════════════════════════════════════════════════════════════════════
# Every model under `models:` is launched (one vLLM server each; setup.sh/run_server.sh
# download only these; a model that fails to load is skipped and the flow degrades).
#
# Type 1 flow (mode: arbiter — the generate→judge design):
#
#     Question
#        ├─ role "generator" models answer CONCURRENTLY in thinking mode,
#        │  each emitting {answer, premises_used, explanation}
#        ├─ the role "judge" model inspects the original premises + question
#        │  plus both juniors' answers (reference only) and decides the truly
#        │  correct answer, re-deriving premises_used + explanation itself
#        ▼
#     deterministic code → the competition result object (Section 4 schema)
#
# Type 2 (physics) uses the FIRST model for its optional LLM calls.
#
# ── The models, with the param count the committee counts (TOTAL, see Q2) ────
#   Qwen/Qwen3.5-4B            4B    (ungated)                     generator
#   google/gemma-4-E2B-it      5.1B total / 2.3B eff  (ungated)    generator
#   google/gemma-4-E4B-it      8B total / 4.5B eff    (ungated)    judge  ← default
#
#   All three are UNGATED — no HF_TOKEN required. The JUDGE can be pointed at any
#   repo via env JUDGE_MODEL (see its entry under `models:`); default Gemma-4-E4B.
#
# ── DISK SWAP (sleep level 2) ────────────────────────────────────────────────
#   With swap: true the two 4B generators stay co-resident and the 8B judge is
#   swapped in only for its arbitration call. The swap uses vLLM SLEEP LEVEL 2:
#   the inactive group's weights are DISCARDED (freed from GPU and RAM) and
#   RELOADED FROM DISK on wake — a few seconds, NOT a full cold start. So nothing
#   is parked in CPU RAM, and only ONE group is on the GPU at a time
#   (peak ~9.1B = the two generators; the judge runs alone at 8B).
#   Set RESIDENCY_SLEEP_LEVEL=1 for the faster RAM-offload swap, or SWAP=0 to hold
#   everything resident.
#
# ── COMPLIANCE (Submission Guide §6.3) ───────────────────────────────────────
#   • Limit is TOTAL params of all LLMs loaded at the SAME MOMENT ≤ 8B-class.
#     This 3-model line-up totals ≈ 17.1B; with disk swap only one group is on
#     the GPU at a time (peak ~9.1B). `max_resident_b: 18` is the explicit
#     acknowledgement that launches it; the launcher warns over 8B.
#   • Strictly-compliant alternatives are kept commented at the bottom.
#
# ── PRECISION (24 GB card) ───────────────────────────────────────────────────
#   Default is bf16 (quantization: none). The two generators are co-resident
#   (~18 GB of weights) during stage 1 — tight on a 24 GB card at 8192 ctx. If you
#   OOM, set env QUANTIZATION=4bit (or 8bit) — that is the only precision lever
#   (context/mem-util stay at their defaults). The judge stage (8B alone) is roomy.
# ═══════════════════════════════════════════════════════════════════════════

# Logic flow:
#   arbiter — generators think → the judge rules → code builds the submission
#             object. With no role tags: every model generates and the highest-
#             weight one arbitrates; a single-model line-up makes two passes
#             (strict + skeptical) and self-judges.
#   vote    — the cascade's weighted soft vote (no judge).
mode: arbiter

# Disk swap (env SWAP overrides). When true (default) and the line-up has a
# `judge` role + ≥1 generator, the generators stay co-resident and the 8B judge is
# swapped in (generators discarded to disk) only for its arbitration call — peak
# GPU = the larger group, so the 2×4B + 8B line-up fits a 24 GB card. The swap uses
# vLLM sleep level 2 (RESIDENCY_SLEEP_LEVEL, default 2 = discard + reload from disk;
# set 1 for RAM offload). Set swap: false to hold all models resident.
swap: true

# Quantization for EVERY model (env QUANTIZATION overrides; a model may override
# with its own `quantization:`). One of:
#   none  — full precision bf16 (~2 B/param). Default.
#   8bit  — online FP8 (~1 B/param). Needs an Ada/Hopper/Blackwell GPU (4090/5070);
#           unsupported on Ampere (A100/3090).
#   4bit  — bitsandbytes NF4 (~0.5 B/param). Needs the `bitsandbytes` package
#           (serve/requirements.txt installs it). Smallest footprint.
quantization: none

# Thinking mode for the reasoning calls (env THINKING overrides; a model may
# override with its own `thinking:`). true = the model emits a reasoning chain
# before its JSON verdict (better reasoning, slower); false = a direct answer
# (faster, cleaner JSON). Default true. Helper JSON calls (premises_used,
# option-pick fallback) are always no-think regardless.
thinking: true

# The residency budget the launch guard enforces (sum of params_b). The
# committee's value is 8. Raising it is an explicit compliance decision — the
# launcher will warn loudly. Env MAX_RESIDENT_B overrides.
max_resident_b: 18

# ── DEFAULT: the generate→judge line-up (2×4B generators + Gemma-4-E4B judge) ─
# Each model also accepts an optional `gpu_memory_utilization:` (0–1) to pin that
# server's vLLM --gpu-memory-utilization instead of the auto split, and an optional
# per-model `quantization:` / `thinking:` that override the globals above.
models:
  - id: Qwen/Qwen3.5-4B
    params_b: 4
    weight: 1.0
    role: generator
    thinking: true                  # per-model override (omit to use the global)
  - id: google/gemma-4-E2B-it       # ungated (Apache-2.0)
    params_b: 5.1                   # total (2.3B effective)
    weight: 1.0
    role: generator
    thinking: true
  # ── JUDGE (Gemma-4-E4B, ungated) ─────────────────────────────────────────
  # Point the judge at any HF repo with env JUDGE_MODEL (no code edit needed);
  # default is google/gemma-4-E4B-it. JUDGE_PARAMS_B overrides the counted size.
  - id: ${JUDGE_MODEL:-google/gemma-4-E4B-it}
    params_b: ${JUDGE_PARAMS_B:-8}
    weight: 1.5
    role: judge
    thinking: true                  # set false for a faster, direct verdict
    # quantization: 8bit            # per-model quant override also works here
    # gpu_memory_utilization: 0.80  # pin this server's GPU fraction (else auto)

# ── Line-up A (strict-8B): the two 4B generators, strongest one arbitrates. ──
# Set max_resident_b: 8 and params_b to the effective counts (4 + 2.3 = 6.3B)
# if your committee counts by class; 4 + 5.1 = 9.1B on strict total counting.
# models:
#   - id: Qwen/Qwen3.5-4B
#     params_b: 4
#     weight: 1.0
#     role: generator
#   - id: google/gemma-4-E2B-it
#     params_b: 2.3
#     weight: 1.0
#     role: generator

# ── Line-up B (strict-8B): single Gemma-4-E4B — two passes + self-judge. ─────
# models:
#   - id: google/gemma-4-E4B-it
#     params_b: 8
#     weight: 1.5
#     role: judge

# ── Line-up C (strict-8B): Qwen3.5-4B alone — smallest, zero ambiguity. ──────
# models:
#   - id: Qwen/Qwen3.5-4B
#     params_b: 4
#     weight: 1.5
